name: iOS Build (unsigned)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Ensure Icon Composer (icontool) is inside Xcode
        run: |
          DEV_DIR="$(xcode-select -p)"
          XC_APP_DIR="$(dirname "$DEV_DIR")/Applications"
          ICON_APP="$XC_APP_DIR/Icon Composer.app"
          echo "Developer dir: $DEV_DIR"
          if [ ! -d "$ICON_APP" ]; then
            for SRC in "/Applications/Icon Composer.app" "$HOME/Applications/Icon Composer.app"; do
              if [ -d "$SRC" ]; then
                echo "Found standalone Icon Composer at $SRC, copying into Xcode"
                sudo cp -R "$SRC" "$ICON_APP"
                break
              fi
            done
          fi
          if [ ! -d "$ICON_APP" ]; then
            echo "::warning::Icon Composer.app not found; actool .icon build will fail"
            ls /Applications/ || true
            mdfind -name "Icon Composer" || true
          fi
          ls "$ICON_APP/Contents/MacOS/" || true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Rust server for iOS
        run: |
          cd kugou_api_server/rust
          ./build_ios.sh

      # =============== 新增：替换图标步骤 ===============
      - name: Replace App Icons
        run: |
          # 1. 解压根目录的 Archive.zip
          unzip Archive.zip -d temp_icons

          # 2. 删除旧的 appiconset 和 icon 目录
          rm -rf ios/Runner/Assets.xcassets/AppIcon.appiconset
          rm -rf ios/Runner/AppIcon.icon

          # 3. 复制你的新 .icon 图标进去
          cp -R temp_icons/AppIcon.icon ios/Runner/AppIcon.icon

          # 4. 验证并打印
          echo "✅ 图标替换完成！"
          ls -R ios/Runner/AppIcon.icon/
      # ===================================================

      - name: Build iOS standard (no codesign, 无 3D 封面)
        run: flutter build ios --release --no-codesign

      - name: Package standard unsigned ipa
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry ../MD3Music-unsigned.ipa Payload

      - name: Diagnose actool/icon build (results in job summary)
        if: failure()
        run: |
          DEV_DIR="$(xcode-select -p)"
          XC_APPS="$(dirname "$DEV_DIR")/Applications"
          {
            echo "## actool diagnostics"
            echo ""
            echo "xcode-select -p: \`$DEV_DIR\`"
            echo ""
            echo "### Xcode Contents/Applications"
            echo '```'
            ls -la "$XC_APPS" 2>&1
            echo '```'
            echo "### /Applications grep icon"
            echo '```'
            ls /Applications 2>/dev/null | grep -i -e icon -e composer || echo "(none)"
            echo '```'
            echo "### mdfind Icon Composer"
            echo '```'
            mdfind -name "Icon Composer" 2>&1 | head -20 || true
            echo '```'
            echo "### which icontool via xcrun"
            echo '```'
            xcrun -f icontool 2>&1 || true
            echo '```'
            echo "### AppIcon.icon contents"
            echo '```'
            ls -la ios/Runner/AppIcon.icon/ 2>&1
            echo '```'
            echo "### icon.json"
            echo '```'
            cat ios/Runner/AppIcon.icon/icon.json 2>&1
            echo '```'
            echo "### find icontool in Icon Composer.app"
            echo '```'
            find "$XC_APPS/Icon Composer.app" -iname "*icontool*" 2>/dev/null || echo "(not found)"
            echo '```'
            echo "### actool test compile (absolute path)"
            echo '```'
            mkdir -p /tmp/actool_test
            xcrun actool "$PWD/ios/Runner/AppIcon.icon" \
              --compile /tmp/actool_test \
              --app-icon AppIcon --include-all-app-icons \
              --platform iphoneos --minimum-deployment-target 15.0 \
              --target-device iphone 2>&1 | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build iOS 3D cover variant (no codesign, ENABLE_DEPTH_3D=true)
        run: flutter build ios --release --no-codesign --dart-define=ENABLE_DEPTH_3D=true

      - name: Package 3D variant unsigned ipa
        run: |
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qry ../MD3Music-3D-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: md3music-ios-unsigned
          path: |
            build/ios/MD3Music-unsigned.ipa
            build/ios/MD3Music-3D-unsigned.ipa

      - name: Read app version from pubspec
        id: appver
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | awk '{print $2}' | tr -d '\r')"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.appver.outputs.tag }}
          name: MD3Music iOS ${{ steps.appver.outputs.tag }}
          body: |
            未签名 IPA：下载后自行签名安装（侧载工具均可）。

            - `MD3Music-unsigned.ipa`：标准版（无 3D 封面，推荐）
            - `MD3Music-3D-unsigned.ipa`：含 3D 封面支持版（设置中显示 3D 封面选项；当前 iOS 端深度推理未接入，生成失败时自动回退平面封面）

            本项目为上游安卓版 [zzyoxml/md3Music](https://github.com/zzyoxml/md3Music) 的 iOS 移植。
          files: |
            build/ios/MD3Music-unsigned.ipa
            build/ios/MD3Music-3D-unsigned.ipa
